<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Master Reviews</title>
    <script>
      // Single Page redirect for GitHub Pages
      // Safely redirects any missing subpath (e.g. /docs or refresh on child path) to the main storefront
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      // For user.github.io/repo/, keep repo name
      var repo = segments.length > 0 && window.location.hostname.includes('github.io') ? '/' + segments[0] + '/' : '/';
      window.location.replace(window.location.protocol + '//' + window.location.host + repo);
    </script>
  </head>
  <body style="font-family:sans-serif;text-align:center;padding:40px;color:#334155;">
    <h2>Redirecting to Master Reviews Storefront...</h2>
    <p>Please wait a moment while we load the products.</p>
  </body>
</html>
