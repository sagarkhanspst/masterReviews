    <script>
      // Fix relative path resolution on GitHub Pages when repository root lacks trailing slash
      if (location.hostname.includes('github.io') && !location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Check if running on static hosting (e.g. GitHub Pages) where /src/main.tsx is uncompiled
      var isLocalDev = window.location.hostname === 'localhost' || 
                       window.location.hostname === '127.0.0.1' || 
                       window.location.port === '3000' ||
                       window.location.hostname.includes('run.app');

      if (!isLocalDev) {
        // Automatically inject the compiled production bundle
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.crossOrigin = 'anonymous';
        css.href = './assets/index.css';
        document.head.appendChild(css);

        var js = document.createElement('script');
        js.type = 'module';
        js.crossOrigin = 'anonymous';
        js.src = './assets/index.js';
        document.body.appendChild(js);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
